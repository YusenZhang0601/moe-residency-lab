name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -v
      - run: python -B examples/make_fixture.py demo-output
      - run: python -B -m moe_residency --ledger demo-output/counts.bin --layout demo-output/layout.json --budgets-gib 0.008 0.016 0.032 --export-profile demo-output/profile.bin
      - run: python -B examples/verify_results.py
      - run: python -B examples/check_publication.py
  prefix-component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: c++ -std=c++17 -Wall -Wextra -Werror patches/accepted_commit_test.cpp -o /tmp/accepted-commit
      - run: /tmp/accepted-commit
