[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-residency-lab"
version = "0.2.0"
description = "Hardware-specific MoE inference studies, first-principles ceiling ledgers and offline verification tools"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "TonyRainforest"}]

[tool.setuptools.packages.find]
include = ["moe_residency*"]
